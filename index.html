<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Frontend Quiz</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Frontend Quiz</h1>
    </header>

    <section id="topic">
        <h2>Escolha o tema:</h2>

        <button type="button" id="html-btn" data-topic="html"><span><i class="fa-solid fa-code" aria-hidden="true"></i></span> HTML</button>
        <button type="button" id="css-btn" data-topic="css"><span><i class="fa-solid fa-palette" aria-hidden="true"></i></span> CSS</button>
        <button type="button" id="js-btn" data-topic="js"><span><i class="fa-brands fa-square-js" aria-hidden="true"></i></span> JavaScript</button>
    </section>

    <section id="level">
        <h2>Escolha o nível:</h2>

        <button type="button" data-level="facil">Fácil</button>
        <button type="button" data-level="medio">Médio</button>
        <button type="button" data-level="dificil">Difícil</button>
    </section>

    <section id="countdown">
        <h2>O quiz vai começar em...</h2>
        
        <span id="countdown-number" aria-live="polite">5</span>
    </section>

    <section id="quiz">
        <div class="quiz-question-items">
            <div class="progress-items">
                <span id="progress-counter">Pergunta 1/10</span>
                
                <span id="progress-timer">Timer</span>
            </div>

            <div class="progress-bar-container">
                <div id="progress-bar"></div>
            </div>

            <h2 id="quiz-question">Texto da pergunta</h2>
        </div>

        <div class="quiz-alternatives">
            <button type="button" data-alternative="0">Alternativa A</button>

            <button type="button" data-alternative="1">Alternativa B</button>

            <button type="button" data-alternative="2">Alternativa C</button>

            <button type="button" data-alternative="3">Alternativa D</button>
        </div>
    </section>

    <section id="result">

    </section>
</body>
</html>
